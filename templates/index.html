<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐帧 · Flipbook Studio</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div class="brand"><span>▤</span><b>逐帧</b><small>FLIPBOOK STUDIO</small></div><div class="header-label">像素动画与游戏精灵制作</div><button id="newProject">＋ 新动画</button><button id="imports">导入素材</button><select id="demoKind" aria-label="演示主题"><option value="robot">机器人行走</option><option value="flame">循环火焰</option><option value="orb">透明星能球</option><option value="tiles">地形瓦片</option></select><button id="demo">打开演示</button><button id="export" class="primary">导出作品 ↗</button></header>
<div class="app">
<aside class="projects"><div class="eyebrow">WORKSPACE</div><h2>动画项目 <span id="projectCount">0</span></h2><input id="search" type="search" placeholder="搜索名称与标签" aria-label="搜索项目"><label class="check"><input id="archived" type="checkbox">包含已归档</label><div id="projectList"></div><div class="local-note"><i></i> 本地创作 · 无需云服务<br><small>像素、图层与时间轴持续保存</small></div></aside>
<main>
<div class="project-head"><div><div class="eyebrow">PIXELS INTO MOTION</div><h1 id="projectName">让一个像素，开始讲故事。</h1><p id="projectInfo">绘制 · 动画 · 图集 · 关卡素材</p></div><div class="actions"><button id="undo" title="撤销">↶ 撤销</button><button id="redo" title="重做">↷ 重做</button><button id="projectSettings">项目设置</button><button id="snapshots">关键版本</button><button id="compose">分轨镜头</button><button id="celTools">共用原画</button></div></div>
<div class="workspace-tabs"><button class="active" id="editorTab">像素工作台</button><button id="toolbox">动画工具箱</button><button id="paletteTools">调色板工坊</button><button id="atlasWorkspace">图集工程</button><button id="roleTools">角色色墨水</button><button id="maps">瓦片地图</button><button id="particles">粒子发射器</button><button id="diagnostics">作品诊断</button></div>
<div class="drawing-toolbar"><label>工具<select id="brush"><option value="pencil">铅笔</option><option value="erase">橡皮擦</option><option value="fill">油漆桶</option><option value="eyedropper">吸管</option><option value="line">直线</option><option value="rectangle">矩形</option><option value="ellipse">椭圆</option><option value="polygon">多边形</option><option value="gradient">渐变</option><option value="text">文字</option></select></label><label>颜色<input id="color" type="color" value="#66e2bd"></label><label>墨水角色<select id="roleInk" aria-label="墨水角色"></select></label><label>墨水覆盖度<input id="roleAlpha" type="number" value="255" min="0" max="255"></label><label>笔迹覆盖度<input id="celAlpha" type="number" value="255" min="0" max="255"></label><label>副色<input id="secondary" type="color" value="#8b9cff"></label><label>笔刷<input id="brushSize" type="number" min="1" max="128" value="1"></label><label class="check"><input id="filled" type="checkbox" checked>填充</label><label class="check"><input id="mirrorX" type="checkbox">镜像X</label><label class="check"><input id="mirrorY" type="checkbox">镜像Y</label><button id="finishPolygon">完成多边形</button></div>
<div class="canvas-bar"><span id="frameName">尚未选择动画帧</span><div><label class="check"><input id="grid" type="checkbox" checked>网格</label><label class="check"><input id="onion" type="checkbox">洋葱皮</label><label>缩放<select id="zoom"><option value="2">2×</option><option value="4">4×</option><option value="6" selected>6×</option><option value="8">8×</option><option value="12">12×</option></select></label><button id="collisionPreview">碰撞框</button></div></div>
<div id="stage"><div id="empty"><div class="empty-art">✦<span>▦</span>✦</div><h2>把想法画成动画</h2><p>新建画布，或打开原创像素演示开始创作</p><small>逐帧绘制 / 可编辑图层 / 透明动画 / 游戏图集</small></div><canvas id="canvas" hidden aria-label="像素绘制画布"></canvas></div>
<div class="palette-bar"><span>PALETTE</span><div id="swatches"></div><button id="addColor">＋ 当前颜色</button><span id="coordinate">—</span></div>
<section class="timeline"><div class="timeline-head"><div class="transport"><button id="play" class="primary">▶ 播放</button><button id="previous">◀</button><button id="next">▶</button><span id="playTime">0 ms</span><select id="clipSelect" aria-label="播放片段"><option value="">完整时间轴</option></select></div><div><button id="selectAll">全选</button><button id="clearSelected">取消选择</button><button id="addFrame">＋ 空帧</button><button id="duplicateFrame">复制帧</button><button id="removeFrames">移除所选</button></div></div><div id="frames"></div><div class="timeline-footer"><span id="timelineInfo">选择动画后显示时间轴</span><button id="frameProperties">帧时长 / 枢轴 / 碰撞框</button><button id="frameLeft">← 前移</button><button id="frameRight">后移 →</button><button id="createClip">保存所选片段</button></div></section>
<div id="status" role="status">准备就绪</div>
</main>
<aside class="inspector"><div class="eyebrow">LAYER COMPOSITOR</div><h2>图层 <span id="layerCount">0</span></h2><div class="layer-actions"><button id="addLayer">＋ 添加</button><button id="copyLayer">复制</button><button id="removeLayer">移除</button></div><div id="layers"></div><div id="layerInspector"></div><div class="inspector-actions"><button id="layerUp">↑ 上移</button><button id="layerDown">↓ 下移</button><button id="mergeLayer">向下合并</button><button id="bakeLayer">烘焙变换</button><button id="clearLayer">清空图层</button><button id="selectionMove">移动选区</button><button id="propagate">跨帧复制</button><button id="stamp">帧图像印章</button></div><div class="hint">从下到上合成图层。像素编辑使用原始坐标；已有变换时先“烘焙变换”。锁定图层可防止误改。</div></aside>
</div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog><script src="/static/app.js"></script></body></html>
